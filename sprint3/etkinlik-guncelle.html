<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2121032052.css">
    <!-- JavaScript dosyamızı bağladık (Ekleme ve Güncelleme aynı dosyayı kullanacak) -->
    <script type="module" src="js/event-form.js"></script>
</head>
<body>

    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <!-- Güncelle menü linki silindi -->
        </nav>
    </header>

    <br>

    <main>
        <!-- Formun id'si ve mesaj kutusu eklendi. Sabit value'lar silindi. -->
        <form id="etkinlik-formu" action="#" method="POST">
            <div>
                <label for="etkinlikAdi">Etkinlik adı</label>
                <input type="text" id="etkinlikAdi" name="etkinlikAdi" required>
            </div>
            
            <div>
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
            </div>
            
            <div>
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" required> 
            </div>

            <div>
                <label for="saat">Saat</label>
                <input type="time" id="saat" name="saat" required> 
            </div>

            <div>
                <label for="yer">Yer</label>
                <input type="text" id="yer" name="yer" required> 
            </div>

            <div>
                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan" min="1" required> 
            </div>
            
            <div>
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
            </div>
            
            <button type="submit">Güncelle</button>
        </form>

        <p id="form-mesaj" style="margin-top: 1rem; font-weight: bold; text-align: center;"></p>
    </main>

    <br>

    <footer>
        <p>Semanur Meto · 2026</p>
    </footer>

</body>
</html>
