<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2121032052.css">
</head>
<body>

    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <br>

    <main>
        <form action="#" method="POST">
            <div>
                <label for="etkinlikAdi">Etkinlik adı</label>
                <input type="text" id="etkinlikAdi" name="etkinlikAdi" required>
            </div>
            
            <div>
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                </select>
            </div>
            
            <div>
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" required> 
            </div>
            
            <div>
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
            </div>
            
            <button type="submit">Kaydet</button>
        </form>
    </main>

    <br>

    <footer>
        <p>Semanur Meto · 2026</p>
    </footer>

</body>
</html>
