<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2121032052.css">
</head>
<body>

    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <br>

    <main>
        <form action="#" method="POST">
            <div>
                <label for="etkinlikAdi">Etkinlik adı</label>
                <input type="text" id="etkinlikAdi" name="etkinlikAdi" value="Kariyer Günleri" required>
            </div>
            
            <div>
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="Seminer" selected>Seminer</option>
                    <option value="Atölye">Atölye</option>
                </select>
            </div>
            
            <div>
                <label for="tarih">Tarih</label>
                <!-- Tarayıcıda 12.10.2026 görünmesi için value YYYY-MM-DD formatında olmalı -->
                <input type="date" id="tarih" name="tarih" value="2026-10-12" required> 
            </div>
            
            <div>
                <label for="aciklama">Açıklama</label>
                <!-- Textarea'da value kullanılmaz, metin etiketlerin arasına yazılır -->
                <textarea id="aciklama" name="aciklama" rows="4" required>Mezun söyleşisi</textarea>
            </div>
            
            <button type="submit">Güncelle</button>
        </form>
    </main>

    <br>

    <footer>
        <p>Semanur Meto · 2026</p>
    </footer>

</body>
</html>
